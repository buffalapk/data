<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>忘れることなんかできない</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f0f0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      width: 80%;
      max-width: 600px;
    }
    .controls {
      margin: 20px 0;
    }
    label {
      margin: 0 15px;
      font-size: 1.1em;
    }
    #lyrics {
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
      text-align: left;
    }
    .line {
      padding: 5px;
      cursor: pointer;
    }
    .active {
      background: yellow;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>忘れることなんかできない</h2>

    <audio id="player" controls>
      <source id="audioSource" src="111.mp3" type="audio/mp3">
      お使いのブラウザは audio タグをサポートしていません。
    </audio>

    <div class="controls">
      <label><input type="checkbox" id="soprano" checked> ソプラノ</label>
      <label><input type="checkbox" id="alto" checked> アルト</label>
      <label><input type="checkbox" id="tenor" checked> テノール</label>
    </div>

    <div id="lyrics"></div>
  </div>

  <script>
    const player = document.getElementById("player");
    const audioSource = document.getElementById("audioSource");
    const soprano = document.getElementById("soprano");
    const alto = document.getElementById("alto");
    const tenor = document.getElementById("tenor");
    const lyricsDiv = document.getElementById("lyrics");

    function getAudioFile() {
      const s = soprano.checked;
      const a = alto.checked;
      const t = tenor.checked;

      if (s && a && t) return "111.mp3";
      if (!s && a && t) return "011.mp3";
      if (!s && a && !t) return "010.mp3";
      if (!s && !a && !t) return "000.mp3";
      if (s && a && !t) return "110.mp3";
      if (s && !a && t) return "101.mp3";
      if (s && !a && !t) return "100.mp3";
      if (!s && !a && t) return "001.mp3";
      return "000.mp3";
    }

    function updateAudio() {
      const currentTime = player.currentTime;
      const newSrc = getAudioFile();

      if (audioSource.src.endsWith(newSrc)) return;

      player.pause();
      audioSource.src = newSrc;
      player.load();
      player.currentTime = currentTime;
      player.play();
    }

    [soprano, alto, tenor].forEach(cb => cb.addEventListener("change", updateAudio));

    // 歌詞読み込み
    let lyrics = [];

    fetch("read.lrc")
      .then(res => res.text())
      .then(data => {
        const lines = data.split("\n");
        lyrics = lines.flatMap(line => {
          const match = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
          if (!match) return [];
          const min = parseInt(match[1], 10);
          const sec = parseFloat(match[2]);
          const text = match[3].trim();
          return [{ time: min * 60 + sec, text }];
        });

        lyrics.forEach((line, index) => {
          const div = document.createElement("div");
          div.textContent = line.text;
          div.classList.add("line");
          div.dataset.time = line.time;
          div.addEventListener("click", () => {
            player.currentTime = line.time;
            player.play();
          });
          lyricsDiv.appendChild(div);
        });
      });

    // 再生中の行をハイライト
    player.addEventListener("timeupdate", () => {
      const currentTime = player.currentTime;
      let currentIndex = lyrics.findIndex((line, i) => 
        currentTime >= line.time && (i === lyrics.length - 1 || currentTime < lyrics[i + 1].time)
      );

      document.querySelectorAll(".line").forEach((el, i) => {
        el.classList.toggle("active", i === currentIndex);
      });
    });

    window.addEventListener("load", () => {
      player.load();
    });
  </script>

</body>
</html>
