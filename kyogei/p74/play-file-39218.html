<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>忘れることなんかできない</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
    }
    .controls {
      margin-top: 20px;
    }
    label {
      margin: 0 15px;
      font-size: 1.1em;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>忘れることなんかできない</h2>

    <audio id="player" controls preload="auto">
      <source id="audioSource" src="111.mp3" type="audio/mp3">
      お使いのブラウザは audio タグをサポートしていません。
    </audio>

    <div class="controls">
      <label><input type="checkbox" id="soprano" checked> ソプラノ</label>
      <label><input type="checkbox" id="alto" checked> アルト</label>
      <label><input type="checkbox" id="tenor" checked> テノール</label>
    </div>
  </div>

  <script>
    const player = document.getElementById("player");
    const audioSource = document.getElementById("audioSource");
    const soprano = document.getElementById("soprano");
    const alto = document.getElementById("alto");
    const tenor = document.getElementById("tenor");

    // 音声ファイルのキャッシュ（バッファ用）
    const audioCache = {};

    const audioFiles = [
      "111.mp3", "110.mp3", "101.mp3", "100.mp3",
      "011.mp3", "010.mp3", "001.mp3", "000.mp3"
    ];

    // すべての音声ファイルをプリロード
    audioFiles.forEach(file => {
      const audio = new Audio(file);
      audio.preload = "auto";
      audioCache[file] = audio;
    });

    function getAudioFile() {
      const s = soprano.checked ? 1 : 0;
      const a = alto.checked ? 1 : 0;
      const t = tenor.checked ? 1 : 0;
      return `${s}${a}${t}.mp3`;
    }

    function updateAudio() {
      const currentTime = player.currentTime;
      const newSrc = getAudioFile();

      if (audioSource.src.endsWith(newSrc)) return;

      // 再生中止と切り替え
      player.pause();
      audioSource.src = newSrc;
      player.load();
      player.currentTime = currentTime;

      // 読み込みが済んでる場合すぐ再生
      audioCache[newSrc]?.readyState >= 2
        ? player.play()
        : player.addEventListener("canplay", () => player.play(), { once: true });
    }

    [soprano, alto, tenor].forEach(cb => cb.addEventListener("change", updateAudio));

    window.addEventListener("load", () => {
      player.load(); // 初期ロード
    });
  </script>

</body>
</html>
