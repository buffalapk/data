<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>忘れることなんかできない</title>
  <link rel="stylesheet" href="https://unpkg.com/mediaelement@4.2.16/build/mediaelementplayer.min.css">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f0f0f0;
      text-align: center;
    }
    audio {
      width: 95vw;
      max-width: 600px;
    }
    .controls {
      margin-top: 15px;
    }
    label {
      margin: 0 10px;
      font-size: 1.2em;
    }
    @media (max-width: 600px) {
      audio { width: 99vw; }
      label { font-size: 1.1em; }
    }
  </style>
</head>
<body>
  <h2>忘れることなんかできない</h2>

  <audio id="player" controls preload="auto">
    <source id="audioSource" src="111.mp3" type="audio/mp3">
    <track id="lyricTrack" kind="subtitles" srclang="ja" label="歌詞" default>
  </audio>

  <div class="controls">
    <label><input type="checkbox" id="soprano" checked> ソプラノ</label>
    <label><input type="checkbox" id="alto" checked> アルト</label>
    <label><input type="checkbox" id="tenor" checked> テノール</label>
  </div>

  <script src="https://unpkg.com/mediaelement@4.2.16/build/mediaelement-and-player.min.js"></script>
  <script>
    const audio = document.getElementById("player");
    const audioSource = document.getElementById("audioSource");
    const lyricTrack = document.getElementById("lyricTrack");

    const soprano = document.getElementById("soprano");
    const alto = document.getElementById("alto");
    const tenor = document.getElementById("tenor");

    // MediaElement初期化
    new MediaElementPlayer(audio);

    // ===== 音声切替 =====
    function getAudioFile() {
      const s = soprano.checked;
      const a = alto.checked;
      const t = tenor.checked;

      if (s && a && t) return "111.mp3";
      if (!s && a && t) return "011.mp3";
      if (!s && a && !t) return "010.mp3";
      if (!s && !a && !t) return "000.mp3";
      if (s && a && !t) return "110.mp3";
      if (s && !a && t) return "101.mp3";
      if (s && !a && !t) return "100.mp3";
      if (!s && !a && t) return "001.mp3";
      return "000.mp3";
    }

    function updateAudio() {
      const currentTime = audio.currentTime;
      const newSrc = getAudioFile();

      if (audioSource.src.endsWith(newSrc)) return;

      audio.pause();
      audioSource.src = newSrc;
      audio.load();
      audio.currentTime = currentTime;
      audio.play();
    }

    [soprano, alto, tenor].forEach(cb => cb.addEventListener("change", updateAudio));

    // ===== 歌詞LRCをVTTに変換してロード =====
    async function loadLyrics() {
      // 君のBase64のLRCをここに差し込む
      const lrcBase64 = `W3RpOuW/mOOCjOOCi+OBk+OBqOOBquOCk+OBi+OBp+OBjeOBquOBhF0KW2FyOuadvuWFg+WNmuW/l10KWzAwOjA1LjkwXeOBk+OBruW6g+OBhOWkp+WcsOOBp+OAgOWDleOBn+OBoeOBr+OCgeOBkOOCiumAoijjgYIp44Gj44GmClswMDoxOC41MF3ovpvjgYvjgaPjgZ/jgZPjgajjgoLjga7jgorotorjgYjjgIDlsJHjgZfjgZrjgaTmg7PjgYTph43jga3lkIjjgYjjgZ/ml6UK...`;

      const lrcText = atob(lrcBase64);
      const lines = lrcText.split(/\r?\n/);

      let vtt = "WEBVTT\n\n";

      function toTimeTag(min, sec) {
        const s = sec.toFixed(3);
        return `${String(min).padStart(2,"0")}:${s.padStart(6,"0")}`;
      }

      for (let i = 0; i < lines.length; i++) {
        const match = lines[i].match(/\[(\d{2}):(\d{2}(?:\.\d{2})?)\](.*)/);
        if (match) {
          const min = parseInt(match[1]);
          const sec = parseFloat(match[2]);
          const start = toTimeTag(min, sec);
          const end = (lines[i+1]?.match(/\[(\d{2}):(\d{2}(?:\.\d{2})?)\]/))
                      ? toTimeTag(parseInt(RegExp.$1), parseFloat(RegExp.$2))
                      : "99:59.000";
          const lyric = match[3].trim();
          if (lyric) {
            vtt += `${start} --> ${end}\n${lyric}\n\n`;
          }
        }
      }

      const blob = new Blob([vtt], { type: "text/vtt" });
      lyricTrack.src = URL.createObjectURL(blob);
    }

    window.addEventListener("load", () => {
      loadLyrics();
    });
  </script>
</body>
</html>
