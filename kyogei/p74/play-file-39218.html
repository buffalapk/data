<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>忘れることなんかできない</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f0f0f0;
    }
    .container {
      text-align: center;
      background: white;
      padding: 30px;
      margin-top: 40px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.2);
      max-width: 600px;
      width: 100%;
    }
    .controls, .lyrics {
      margin-top: 20px;
    }
    label {
      margin: 0 15px;
      font-size: 1.1em;
    }
    .lyrics span {
      display: block;
      margin: 5px 0;
      cursor: pointer;
    }
    .lyrics .active {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>忘れることなんかできない</h2>

    <audio id="player" controls>
      <source id="audioSource" src="111.mp3" type="audio/mp3">
      お使いのブラウザは audio タグをサポートしていません。
    </audio>

    <div class="controls">
      <label><input type="checkbox" id="soprano" checked> ソプラノ</label>
      <label><input type="checkbox" id="alto" checked> アルト</label>
      <label><input type="checkbox" id="tenor" checked> テノール</label>
    </div>

    <div class="controls">
      <input type="file" id="lrcFile" accept=".lrc">
    </div>

    <div class="lyrics" id="lyrics"></div>
  </div>

  <script>
    const player = document.getElementById("player");
    const audioSource = document.getElementById("audioSource");
    const soprano = document.getElementById("soprano");
    const alto = document.getElementById("alto");
    const tenor = document.getElementById("tenor");
    const lrcInput = document.getElementById("lrcFile");
    const lyricsDiv = document.getElementById("lyrics");

    let lyrics = [];

    function getAudioFile() {
      const s = soprano.checked;
      const a = alto.checked;
      const t = tenor.checked;

      if (s && a && t) return "111.mp3";
      if (!s && a && t) return "011.mp3";
      if (!s && a && !t) return "010.mp3";
      if (!s && !a && !t) return "000.mp3";
      if (s && a && !t) return "110.mp3";
      if (s && !a && t) return "101.mp3";
      if (s && !a && !t) return "100.mp3";
      if (!s && !a && t) return "001.mp3";
      return "000.mp3";
    }

    function updateAudio() {
      const currentTime = player.currentTime;
      const newSrc = getAudioFile();

      if (audioSource.src.endsWith(newSrc)) return;

      player.pause();
      audioSource.src = newSrc;
      player.load();
      player.currentTime = currentTime;
      player.play();
    }

    function parseLRC(text) {
      const lines = text.split('\n');
      const result = [];

      for (let line of lines) {
        const match = line.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
        if (match) {
          const minutes = parseInt(match[1]);
          const seconds = parseFloat(match[2]);
          const time = minutes * 60 + seconds;
          const lyric = match[3].trim();
          if (lyric) {
            result.push({ time, lyric });
          }
        }
      }

      return result.sort((a, b) => a.time - b.time);
    }

    function displayLyrics() {
      lyricsDiv.innerHTML = '';
      lyrics.forEach((item, index) => {
        const span = document.createElement('span');
        span.textContent = item.lyric;
        span.dataset.time = item.time;
        span.addEventListener('click', () => {
          player.currentTime = item.time;
          player.play();
        });
        lyricsDiv.appendChild(span);
      });
    }

    lrcInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          lyrics = parseLRC(evt.target.result);
          displayLyrics();
        };
        reader.readAsText(file, 'UTF-8');
      }
    });

    player.addEventListener('timeupdate', () => {
      const currentTime = player.currentTime;
      let currentIndex = -1;

      for (let i = 0; i < lyrics.length; i++) {
        if (currentTime >= lyrics[i].time) {
          currentIndex = i;
        } else {
          break;
        }
      }

      const spans = lyricsDiv.querySelectorAll('span');
      spans.forEach(span => span.classList.remove('active'));
      if (currentIndex !== -1) {
        spans[currentIndex].classList.add('active');
      }
    });

    [soprano, alto, tenor].forEach(cb => cb.addEventListener("change", updateAudio));

    window.addEventListener("load", () => {
      player.load(); // 初期状態
    });
  </script>

</body>
</html>
