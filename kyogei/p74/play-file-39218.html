<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声プレイヤー</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mediaelement@4.2.16/build/mediaelementplayer.min.css">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    /* PC用 */
    .controls {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .controls label {
      font-size: 1.2rem;
      cursor: pointer;
    }

    /* モバイル用 */
    @media (max-width: 768px) {
      h1 {
        font-size: 1.4rem;
      }

      .controls {
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }

      .controls label {
        font-size: 1.4rem;
        background: #fff;
        padding: 12px 20px;
        border-radius: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        width: 80%;
        text-align: center;
      }

      .controls input[type="checkbox"] {
        transform: scale(1.5);
        margin-right: 10px;
      }
    }
  </style>
</head>
<body>
  <h1>パート別音声プレイヤー</h1>
  <div class="controls">
    <label><input type="checkbox" id="soprano"> ソプラノ</label>
    <label><input type="checkbox" id="alto"> アルト</label>
    <label><input type="checkbox" id="tenor"> テノール</label>
  </div>

  <audio id="player" controls>
    <source id="audioSource" src="000.mp3" type="audio/mp3">
  </audio>

  <script src="https://cdn.jsdelivr.net/npm/mediaelement@4.2.16/build/mediaelement-and-player.min.js"></script>
  <script>
    let player;

    document.addEventListener('DOMContentLoaded', function() {
      player = new MediaElementPlayer('player');
    });

    const audioSource = document.getElementById("audioSource");
    const soprano = document.getElementById("soprano");
    const alto = document.getElementById("alto");
    const tenor = document.getElementById("tenor");

    // プリロード
    const audioFiles = ["000.mp3","001.mp3","010.mp3","011.mp3","100.mp3","101.mp3","110.mp3","111.mp3"];
    const audioBuffers = {};
    audioFiles.forEach(file => {
      const audio = new Audio();
      audio.src = file;
      audio.preload = "auto";
      audioBuffers[file] = audio;
    });

    function getAudioFile() {
      const s = soprano.checked;
      const a = alto.checked;
      const t = tenor.checked;

      if (s && a && t) return "111.mp3";
      if (!s && a && t) return "011.mp3";
      if (!s && a && !t) return "010.mp3";
      if (!s && !a && !t) return "000.mp3";
      if (s && a && !t) return "110.mp3";
      if (s && !a && t) return "101.mp3";
      if (s && !a && !t) return "100.mp3";
      if (!s && !a && t) return "001.mp3";
      return "000.mp3";
    }

    function updateAudio() {
      if (!player) return;
      const currentTime = player.media.currentTime;
      const newSrc = getAudioFile();

      if (audioSource.src.endsWith(newSrc)) return;

      player.pause();
      audioSource.src = newSrc;
      player.setSrc(newSrc);
      player.load();
      player.media.currentTime = currentTime;
      player.play();
    }

    [soprano, alto, tenor].forEach(cb => cb.addEventListener("change", updateAudio));
  </script>
</body>
</html>
