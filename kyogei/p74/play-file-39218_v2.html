<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘れることなんかできない</title>
  <link rel="stylesheet" href="https://unpkg.com/mediaelement@4.2.16/build/mediaelementplayer.min.css">
  <script type="module" src="https://esm.run/@material/web/all.js"></script>
  <script type="module" src="https://esm.run/@material/web/icon/icon.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex flex-col items-center p-4">

  <div class="bg-white rounded-2xl shadow-xl p-8 w-full flex flex-col items-center">
    <h2 class="text-3xl md:text-4xl font-bold mb-6 text-gray-800 text-center">忘れることなんかできない</h2>
    
    <!-- Media Player (unchanged as Media Web does not have a native audio player component) -->
    <audio id="player" controls class="w-full">
      <source id="audioSource" src="111.mp3" type="audio/mp3">
      お使いのブラウザは audio タグをサポートしていません。
    </audio>

    <div class="controls mt-6 flex flex-wrap justify-center gap-4">
      <div class="flex items-center">
        <md-checkbox touch-target="wrapper" id="soprano" checked></md-checkbox>
        <label for="soprano" class="font-medium text-gray-700">ソプラノ</label>
      </div>
      <div class="flex items-center">
        <md-checkbox touch-target="wrapper" id="alto" checked></md-checkbox>
        <label for="alto" class="font-medium text-gray-700">アルト</label>
      </div>
      <div class="flex items-center">
        <md-checkbox touch-target="wrapper" id="tenor" checked></md-checkbox>
        <label for="tenor" class="font-medium text-gray-700">テノール</label>
      </div>
    </div>

    <div class="lyrics mt-8 w-full text-left text-gray-800 font-normal leading-relaxed overflow-y-auto"></div>
    
    <md-filled-button class="mt-8" id="exportButton">歌詞をエクスポート</md-filled-button>

  </div>

<script src="https://unpkg.com/mediaelement@4.2.16/build/mediaelement-and-player.min.js"></script>
<script>
let player;
const audioEl = document.getElementById('player');
const audioSource = document.getElementById('audioSource');
const soprano = document.getElementById('soprano');
const alto = document.getElementById('alto');
const tenor = document.getElementById('tenor');
const lyricsContainer = document.querySelector('.lyrics');
const exportButton = document.getElementById('exportButton');
let lyricLines = [];

// MediaElementPlayer 初期化
document.addEventListener('DOMContentLoaded', () => {
  player = new MediaElementPlayer(audioEl);
  loadLyrics();
});

// チェックボックスに応じた音源を返す
function getAudioFile() {
  const s = soprano.checked ? "1" : "0";
  const a = alto.checked ? "1" : "0";
  const t = tenor.checked ? "1" : "0";
  return `${s}${a}${t}.mp3`;
}

// 音源更新
function updateAudio() {
  if (!player) return;
  const currentTime = player.media.currentTime;
  const newSrc = getAudioFile();
  if (audioSource.src.endsWith(newSrc)) return;

  audioSource.src = newSrc;
  player.media.load();
  player.media.currentTime = currentTime;
  player.media.play();
}

[soprano, alto, tenor].forEach(cb => cb.addEventListener('change', updateAudio));

// 歌詞読み込み（例：Base64 LRC）
async function loadLyrics() {
  try {
    const res = await fetch("data:application/octet-stream;base64,W3RpOuW/mOOCjOOCi+OBk+OBqOOBquOCk+OBi+OBp+OBjeOBquOBhF0KW2FyOuadvuWFg+WNmuW/l10KWzAwOjA1LjkwXeOBk+OBruW6g+OBhOWkp+WcsOOBp+OAgOWDleOBn+OBoeOBr+OCgeOBkOOCiumAoijjgYIp44Gj44GmClswMDoxOC41MF3ovpvjgYvjgaPjgZ/jgZPjgajjgoLjga7jgorotorjgYjjgIDlsJHjgZfjgZrjgaTmg7PjgYTph43jga3lkIjjgYjjgZ/ml6UKWzAwOjMyLjMwXembouOCjOOBsOOBquOCjOOBq+OBquOCi+OBruOBr+OBmeOBlOOBj+WvguOBl+OBhOOBkeOCjOOBqQpbMDA6NDQuOTBd5YOV44Gf44Gh44Gu6ZW344GE5peF44Gv44CA44G+44Gg44CA5aeL44G+44Gj44Gf44Gw44GL44KK44Gg44GL44KJClswMTowMi42MF3mlK/jgYjlkIjjgaPjgZ/jgorjgIDmtpnjgoLmtYHjgZflkIjjgYjjgZ/jga0KWzAxOjE0LjkwXeOBr+OCi+OBi+OBquWkouOCkui/veOBhOOBi+OBkeOBn+OAgOi8neOBj+Wto+evgOOBq+OCguOBhuS6jOW6puOBqApbMDE6MjcuOTBd44KC44Gp44KM44Gq44GE44CA44KC44Gp44KM44Gq44GE44CA44KC44Gp44KM44Gq44GEClswMTozMi4zMF3jgZHjgozjganigKYKWzAxOjM0LjMwXeW/mOOCjOOBquOBhO+8geOAgOW/mOOCjOOBquOBhO+8ge+8geOAgOW/mOOCjOOCi+OBk+OBqOOBquOCk+OBi+OBp+OBjeOBquOBhO+8ge+8ge+8gQpbMDE6NDMuNzBd44Op44Op44Op4oCmClswMTo1Ni4wMF3jga/jgovjgYvjgarlpKLjgpLov73jgYTjgYvjgZHjgZ/jgIDovJ3jgY/lraPnr4DjgavjgoLjgYbkuozluqbjgagKWzAyOjA5LjAwXeOCguOBqeOCjOOBquOBhOOAgOOCguOBqeOCjOOBquOBhOOAgOOCguOBqeOCjOOBquOBhApbMDI6MTMuMjBd44GR44KM44Gp4oCmClswMjoxNS4zMF3lv5jjgozjgarjgYTvvIHjgIDlv5jjgozjgarjgYTvvIHvvIHjgIDlv5jjgozjgovjgZPjgajjgarjgpPjgYvjgafjgY3jgarjgYTvvIHvvIHvvIEKWzAyOjI0LjgwXeW/mOOCjOOBquOBhO+8geOAgOW/mOOCjOOBquOBhO+8ge+8geOAgOW/mOOCjOOCi+OBk+OBqOOBquOCk+OBi+OBp+OBjeOBquOBhO+8ge+8ge+8gQ==");
    const text = await res.text();
    const lines = text.split("\n");
    lyricLines = [];
    lyricsContainer.innerHTML = "";

    lines.forEach(line => {
      const match = line.match(/\[(\d{2}):(\d{2}(?:\.\d{2})?)\](.*)/);
      if (match) {
        const min = parseInt(match[1]);
        const sec = parseFloat(match[2]);
        const time = min * 60 + sec;
        const lyric = match[3].trim();

        const div = document.createElement("div");
        div.textContent = lyric;
        div.dataset.time = time;
        div.classList.add("text-gray-600", "p-1", "cursor-pointer", "hover:bg-gray-200", "rounded-md", "transition-colors");
        div.addEventListener("click", () => { player.media.currentTime = time; player.media.play(); });

        lyricsContainer.appendChild(div);
        lyricLines.push({ time, element: div });
      }
    });
  } catch (e) {
    lyricsContainer.innerHTML = "<p class='text-red-500'>歌詞ファイルの読み込みに失敗しました。</p>";
    console.error(e);
  }
}

// ハイライト更新
function updateHighlight() {
  if (!player) return;
  const currentTime = player.media.currentTime;
  let activeLine = null;
  for (let i = 0; i < lyricLines.length; i++) {
    const thisTime = lyricLines[i].time;
    const nextTime = lyricLines[i + 1] ? lyricLines[i + 1].time : Infinity;
    if (currentTime >= thisTime && currentTime < nextTime) {
      activeLine = lyricLines[i];
      break;
    }
  }

  // Highlight the current line and scroll it into view
  lyricLines.forEach(line => {
    const isCurrent = line === activeLine;
    line.element.classList.toggle("bg-yellow-200", isCurrent);
    line.element.classList.toggle("font-bold", isCurrent);
    if (isCurrent) {
      line.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

// 歌詞をtxtとしてエクスポート
function exportLyrics() {
  const lyricsText = lyricLines.map(line => line.element.textContent).join('\n');
  const blob = new Blob([lyricsText], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'lyrics.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

exportButton.addEventListener('click', exportLyrics);
audioEl.addEventListener("timeupdate", updateHighlight);
</script>
</body>
</html>
